<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple todo list app built with vanilla JavaScript and GitHub Copilot">
    <title>Simple Todo App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 My Todo List</h1>
            <p class="subtitle">Built with GitHub Copilot</p>
        </header>

        <main>
            <div class="todo-input-container">
                <input 
                    type="text" 
                    id="todoInput" 
                    placeholder="What needs to be done?"
                    aria-label="New todo input"
                    autocomplete="off"
                >
                <button id="addBtn" aria-label="Add todo">Add</button>
            </div>

            <div class="todo-list-container">
                <ul id="todoList" class="todo-list"></ul>
            </div>

            <div class="todo-footer">
                <span id="todoCount" class="todo-count">0 items left</span>
                
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>

                <button id="clearCompleted" class="clear-completed">Clear Completed</button>
            </div>
        </main>

        <footer class="app-footer">
            <p>Click to mark complete • Double-click to edit (future feature)</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
